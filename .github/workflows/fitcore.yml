name: fitcore

on:
  push:
    paths:
      - "fit/**"
      - ".github/workflows/fitcore.yml"
  pull_request:
    paths:
      - "fit/**"
      - ".github/workflows/fitcore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Build the C++ library and tests
        run: |
          cmake -S fit/fitcore -B build/fitcore -DCMAKE_BUILD_TYPE=Release
          cmake --build build/fitcore -j

      - name: C++ tests (T1 to T5, K0)
        run: ctest --test-dir build/fitcore --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install numpy pybind11 pytest

      - name: Build the Python module
        run: |
          cmake -S fit/fitcore -B build/fitcore -DFITCORE_PYTHON=ON \
            -DPython_EXECUTABLE="$(which python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build/fitcore -j

      - name: Python tests (reference T1 to T5, agreement T6 and T7)
        env:
          FITCORE_BUILD_DIR: build/fitcore
        run: python -m pytest fit/tests -q
